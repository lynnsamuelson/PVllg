name: CI / Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: coverage run manage.py test
      # Fails if coverage drops below fail_under in .coveragerc.
      - run: coverage report --format=markdown | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Fails if coverage drops below the thresholds in vite.config.js.
      - run: npm run coverage
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      # playwright.config.js starts Django and Vite itself.
      - run: npm run e2e
        working-directory: frontend
        env:
          PYTHON: python
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  deploy:
    needs: [backend, frontend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: http://${{ vars.VM_HOST }}/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Configure SSH
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VM_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Build release bundle and env file
        env:
          VM_HOST: ${{ vars.VM_HOST }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          DEFAULT_FROM_EMAIL: ${{ secrets.DEFAULT_FROM_EMAIL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          tar --exclude='__pycache__' --exclude='.env' --exclude='*.sqlite3' \
              -czf release.tgz backend deploy frontend/dist
          umask 077
          {
            echo "DJANGO_SECRET_KEY=$DJANGO_SECRET_KEY"
            echo "DJANGO_DEBUG=false"
            echo "DJANGO_ALLOWED_HOSTS=$VM_HOST,localhost,127.0.0.1"
            echo "DJANGO_CSRF_TRUSTED_ORIGINS=http://$VM_HOST"
            # Leave the DB_HOST secret unset to fall back to SQLite on the VM.
            if [ -n "$DB_HOST" ]; then
              echo "DB_HOST=$DB_HOST"
              echo "DB_NAME=${DB_NAME:-hackathon}"
              echo "DB_USER=$DB_USER"
              echo "DB_PASSWORD=$DB_PASSWORD"
            fi
            # Leave the EMAIL_HOST secret unset and emails (org codes) print to journalctl instead. Blank secrets
            # are left out so they can't override the defaults in settings.py with empty values.
            # ADMIN_EMAIL/ADMIN_PASSWORD: main Django admin login, created or reset on every deploy by manage.py ensure_admin.
            for name in EMAIL_HOST EMAIL_PORT EMAIL_HOST_USER EMAIL_HOST_PASSWORD DEFAULT_FROM_EMAIL ADMIN_EMAIL ADMIN_PASSWORD; do
              if [ -n "${!name}" ]; then echo "$name=${!name}"; fi
            done
          } > app.env

      - name: Upload and deploy
        env:
          VM_HOST: ${{ vars.VM_HOST }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o BatchMode=yes"
          scp -i ~/.ssh/deploy_key -o BatchMode=yes release.tgz app.env "opc@$VM_HOST:/tmp/"
          $SSH "opc@$VM_HOST" 'bash -s' < deploy/remote-deploy.sh

      - name: Public smoke test
        env:
          VM_HOST: ${{ vars.VM_HOST }}
        run: curl -fsS "http://$VM_HOST/api/health/"
