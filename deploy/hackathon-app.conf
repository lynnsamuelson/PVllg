# Apache vhost (installed to /etc/httpd/conf.d/ by remote-deploy.sh).
# React build is served from disk; /api and /admin go to gunicorn on localhost.
<VirtualHost *:80>
    DocumentRoot /var/www/hackathon-app

    ProxyPreserveHost On
    ProxyTimeout 120
    RequestHeader set X-Forwarded-Proto "http"
    ProxyPass        /api/   http://127.0.0.1:8000/api/
    ProxyPassReverse /api/   http://127.0.0.1:8000/api/
    ProxyPass        /admin/ http://127.0.0.1:8000/admin/
    ProxyPassReverse /admin/ http://127.0.0.1:8000/admin/

    <Directory /var/www/hackathon-app>
        Options -Indexes
        AllowOverride None
        Require all granted
        # Client-side routing: unknown paths fall back to the SPA.
        FallbackResource /index.html
    </Directory>

    <Location /assets/>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Location>

    ErrorLog  /var/log/httpd/hackathon-app-error.log
    CustomLog /var/log/httpd/hackathon-app-access.log combined
</VirtualHost>
